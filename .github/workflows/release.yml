name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run if commit is not from semantic-release itself
    if: github.event.head_commit.author.name != 'github-actions'
    concurrency: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GH_TOKEN (PAT) preferred so version bump commits trigger CI.
          # Falls back to GITHUB_TOKEN if GH_TOKEN secret not configured yet.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short

      - name: Python Semantic Release
        id: semrel
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package
        if: steps.semrel.outputs.released == 'true'
        run: |
          pip install build
          rm -rf dist/
          python -m build

      - name: Publish to PyPI
        if: steps.semrel.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses OIDC trusted publisher — configure at pypi.org/manage/project/ramets/settings/publishing/
          # No API token needed
          skip-existing: true

      - name: Publish to GitHub Releases
        if: steps.semrel.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.semrel.outputs.tag }}
