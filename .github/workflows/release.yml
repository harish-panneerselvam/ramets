name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run if CI passes and commit is not from semantic-release itself
    if: github.event.head_commit.author.name != 'github-actions'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release build

      - name: Run tests before release
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short

      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          semantic-release version
          semantic-release publish

      - name: Build package
        if: steps.release.outcome == 'success'
        run: python -m build

      - name: Publish to PyPI
        if: steps.release.outcome == 'success'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses OIDC trusted publisher — configure at pypi.org/manage/project/ramets/settings/publishing/
          # No API token needed
          skip-existing: true
